<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz de 5 preguntas: descubre qué tipo de emprendedor eres. Universidad Ean.">
<title>¿Qué emprendedor eres?</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column on the infographic's vermilion ground, white rings in the top-right corner, one screen at a time (intro → 5 preguntas → perfil) */
:root{
  --bg:#C9431A;
  --bg-deep:#A8350F;
  --ink:#FFFFFF;
  --cream:#FFF3E6;
  --navy:#1E2742;
  --peach:#F7B07A;
  --maroon:#7A1F0C;
  --font:'Lexend','Segoe UI',system-ui,sans-serif;
  --r:90px;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100%;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;padding-block:28px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.rings{position:absolute;top:calc(var(--r) * -1);right:calc(var(--r) * -1);width:calc(var(--r) * 2);height:calc(var(--r) * 2);pointer-events:none}
.rings span{position:absolute;inset:0;border:10px solid var(--ink);border-radius:50%}
.rings span:nth-child(2){inset:calc(var(--r) * -0.4)}
.rings span:nth-child(3){inset:calc(var(--r) * -0.8)}
.shell{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:28px}
.top{display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 120px)}
.top .org{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.top .cls{margin:0;font-size:14px;font-weight:500;line-height:1.3;color:var(--cream)}
.screen{display:flex;flex-direction:column;gap:22px}

/* Intro */
.hero{position:relative;display:flex;flex-direction:column;gap:14px}
.spark{position:absolute;left:-6px;top:-30px;display:flex;gap:8px;align-items:flex-end}
h1{margin:0;font-size:clamp(40px, 11vw, 62px);font-weight:400;line-height:1.02;letter-spacing:-0.02em;text-wrap:balance}
h1 b{font-weight:700}
.lead{margin:0;font-size:19px;font-weight:500;line-height:1.35;color:var(--cream);text-wrap:pretty}
.profiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px 12px}
.profiles li{display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;font-weight:600;line-height:1.25}
.dot{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--peach);color:var(--navy)}
.dot.alt{background:var(--navy);color:var(--ink)}
.dot svg{width:26px;height:26px}

/* Buttons */
.btn{align-self:flex-start;min-height:56px;padding:0 30px;border:0;border-radius:999px;background:var(--navy);color:var(--ink);font:600 18px/1 var(--font);cursor:pointer;transition:transform .15s ease, background .15s ease}
.btn:hover{background:#2A3657}
.btn:active{transform:scale(.97)}
.link{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:none;color:var(--ink);font:500 16px/1 var(--font);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

/* Quiz */
.progress{display:flex;flex-direction:column;gap:10px}
.count{font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.segs{display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:6px}
.segs i{height:6px;border-radius:3px;background:var(--bg-deep);transition:background .2s ease}
.segs i.on{background:var(--cream)}
h2{margin:0;font-size:clamp(26px, 7vw, 34px);font-weight:600;line-height:1.15;letter-spacing:-0.01em;text-wrap:balance}
h2:focus{outline:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;box-sizing:border-box;padding:12px 16px;border:0;border-radius:10px;background:var(--cream);color:var(--navy);font:500 17px/1.3 var(--font);text-align:left;cursor:pointer;transition:transform .15s ease, background .15s ease, color .15s ease}
.opt:hover{background:var(--ink)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{background:var(--navy);color:var(--ink)}
.opt:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.opt[aria-pressed="true"]:focus-visible{outline-color:var(--cream)}
.key{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--peach);color:var(--navy);font-size:14px;font-weight:700}

/* Result */
.badge{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--peach);color:var(--navy);box-shadow:0 0 0 14px var(--bg-deep)}
.badge svg{width:64px;height:64px}
.eyebrow{margin:0 0 -14px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.rname{font-size:clamp(32px, 9vw, 44px);font-weight:700;line-height:1.05}
.theory{margin:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.theory span{font-size:16px;line-height:1.4}
.sec{display:inline-block;padding:8px 14px;background:var(--cream);color:var(--navy);font-size:14px;font-weight:600}
.mix{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.mix h3{margin:0;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(0, 1.3fr) minmax(0, 2fr) auto;align-items:center;gap:12px;font-size:15px;line-height:1.25}
.bars li.win{font-weight:700}
.track{height:10px;border-radius:5px;background:var(--bg-deep);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px;background:var(--peach);transition:width .5s ease}
.bars li:not(.win) .fill{background:var(--cream)}
.num{font-variant-numeric:tabular-nums;font-weight:600}

.foot{margin:auto 0 0;padding-top:24px;font-size:13px;line-height:1.35;color:var(--ink)}

@media (max-width:600px){
  :root{--r:60px}
  .rings span{border-width:8px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="page">
  <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="shell">
    <header class="top">
      <p class="org">Universidad Ean</p>
      <p class="cls">Ser emprendedor = actor de cambio</p>
    </header>

    <section id="intro" class="screen" aria-labelledby="title">
      <div class="hero">
        <div class="spark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#7A1F0C"></path></svg>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#F7B07A"></path></svg>
        </div>
        <h1 id="title">¿Qué tipo de <b>emprendedor</b> eres?</h1>
        <p class="lead">5 preguntas, menos de un minuto. Descubre cuál de estos perfiles eres.</p>
      </div>
      <ul class="profiles" id="profiles"></ul>
      <button id="start" class="btn" type="button">Empezar</button>
    </section>

    <section id="quiz" class="screen" hidden>
      <div class="progress">
        <span class="count" id="count">Pregunta 1 de 5</span>
        <div class="segs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <h2 id="qtext" tabindex="-1"></h2>
      <div id="opts" class="opts" role="group" aria-labelledby="qtext"></div>
      <button id="back" class="link" type="button">Anterior</button>
    </section>

    <section id="result" class="screen" hidden>
      <div class="badge" id="rIcon" aria-hidden="true"></div>
      <p class="eyebrow">Tu perfil</p>
      <h2 id="rName" class="rname" tabindex="-1"></h2>
      <p id="rDesc" class="lead"></p>
      <p class="theory"><span id="rTheory"></span><span class="sec" id="rSec"></span></p>
      <div class="mix">
        <h3>Tu mezcla</h3>
        <ul class="bars" id="rBars"></ul>
      </div>
      <button id="again" class="btn" type="button">Repetir</button>
    </section>

    <p class="foot">Basado en Schumpeter, Kirzner y los perfiles emprendedores de la Universidad Ean.</p>
  </div>
</div>

<script>
const SVG = (inner) => '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
const ICONS = {
  inn: SVG('<path d="M24 4c7 5 10 13 9 22l-4 6H19l-4-6c-1-9 2-17 9-22Z"/><circle cx="24" cy="17" r="3.5"/><path d="M15 26l-6 5v7l8-4M33 26l6 5v7l-8-4"/><path d="M21 37c0 3 1.5 5 3 7 1.5-2 3-4 3-7"/>'),
  opo: SVG('<circle cx="21" cy="21" r="12"/><path d="M30 30l11 11"/><path d="M15.5 21a5.5 5.5 0 0 1 5.5-5.5"/>'),
  cor: SVG('<path d="M24 41C10 32 5 24 5 17A9.5 9.5 0 0 1 24 13A9.5 9.5 0 0 1 43 17C43 24 38 32 24 41Z"/><path d="M13 22h6l2.5-5 4 10 2.5-5h7"/>'),
  intra: SVG('<path d="M6 42h36"/><path d="M11 42V12h18v30"/><path d="M29 22h8v20"/><path d="M16 18h2M22 18h2M16 25h2M22 25h2M16 32h2M22 32h2"/><path d="M18 42v-5h4v5"/><path d="M38 4v9M33.5 8.5h9"/>')
};
const ORDER = ['inn', 'opo', 'cor', 'intra'];
const P = {
  inn: {
    name: 'El Innovador', short: 'Innovador',
    desc: 'Creas lo que no existe y reemplazas lo viejo. Te mueve cambiar las reglas del juego.',
    theory: 'Joseph Schumpeter lo llamó destrucción creativa.',
    sec: 'Sección 01 · Teorías clásicas'
  },
  opo: {
    name: 'El Cazador de oportunidades', short: 'Cazador de oportunidades',
    desc: 'Ves lo que otros pasan por alto y actúas antes que nadie.',
    theory: 'Israel Kirzner lo llamó estado de alerta empresarial.',
    sec: 'Sección 01 · Teorías clásicas'
  },
  cor: {
    name: 'El Emprendedor de Corazón', short: 'Emprendedor de Corazón',
    desc: 'Tu negocio nace de un propósito: resolver un problema real de tu comunidad.',
    theory: 'Es el perfil eanista: sostenibilidad, propósito e impacto.',
    sec: 'Sección 03 · Emprendedor de Corazón'
  },
  intra: {
    name: 'El Intraemprendedor', short: 'Intraemprendedor',
    desc: 'Transformas las organizaciones desde adentro y convences a otros de cambiar.',
    theory: 'Es el Gerente Visionario que forma la Ean.',
    sec: 'Sección 04 · Intraemprendimiento'
  }
};
const Q = [
  { q: 'Se te ocurre una idea a las 2 a. m. ¿Qué haces?', o: [
    ['La anoto: puede cambiarlo todo.', 'inn'],
    ['Busco si alguien pagaría por ella.', 'opo'],
    ['Pienso a quién podría ayudar.', 'cor'],
    ['La propongo en mi trabajo o universidad.', 'intra']
  ]},
  { q: '¿Qué te emociona más de emprender?', o: [
    ['Crear algo que nunca ha existido.', 'inn'],
    ['Encontrar un hueco que nadie vio.', 'opo'],
    ['Cambiarle la vida a alguien.', 'cor'],
    ['Mejorar algo que ya funciona.', 'intra']
  ]},
  { q: 'Tu proyecto fracasa. ¿Qué piensas?', o: [
    ['Lo rediseño desde cero.', 'inn'],
    ['Busco la siguiente oportunidad.', 'opo'],
    ['El problema sigue ahí; no me rindo.', 'cor'],
    ['Lo aprendido le sirve al equipo.', 'intra']
  ]},
  { q: '¿Dónde te ves en 10 años?', o: [
    ['Con una startup que cambie la industria.', 'inn'],
    ['Con varios negocios propios.', 'opo'],
    ['Liderando un proyecto con impacto social.', 'cor'],
    ['Dirigiendo la innovación en una gran empresa.', 'intra']
  ]},
  { q: '¿Cuál es tu superpoder?', o: [
    ['Imaginar lo que no existe.', 'inn'],
    ['Ver oportunidades antes que nadie.', 'opo'],
    ['Entender lo que la gente necesita.', 'cor'],
    ['Convencer a otros de cambiar.', 'intra']
  ]}
];

const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let answers = [];
let orders = [];
let i = 0;
let busy = false;

function shuffle(list) {
  const a = list.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function show(id) {
  ['intro', 'quiz', 'result'].forEach((s) => { $(s).hidden = s !== id; });
  window.scrollTo(0, 0);
}

function renderProfiles() {
  const ul = $('profiles');
  ORDER.forEach((p, k) => {
    const li = document.createElement('li');
    const dot = document.createElement('span');
    dot.className = 'dot' + (k % 2 ? ' alt' : '');
    dot.innerHTML = ICONS[p];
    const label = document.createElement('span');
    label.textContent = P[p].short;
    li.append(dot, label);
    ul.append(li);
  });
}

function start() {
  answers = [];
  i = 0;
  orders = Q.map((q) => shuffle(q.o));
  show('quiz');
  renderQ();
}

function renderQ() {
  const q = Q[i];
  $('count').textContent = 'Pregunta ' + (i + 1) + ' de ' + Q.length;
  document.querySelectorAll('.segs i').forEach((s, k) => s.classList.toggle('on', k <= i));
  $('qtext').textContent = q.q;
  const box = $('opts');
  box.replaceChildren();
  orders[i].forEach(([text, p], k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.id = 'opt-' + i + '-' + k;
    b.setAttribute('aria-pressed', answers[i] === p ? 'true' : 'false');
    const key = document.createElement('span');
    key.className = 'key';
    key.setAttribute('aria-hidden', 'true');
    key.textContent = 'ABCD'[k];
    const t = document.createElement('span');
    t.textContent = text;
    b.append(key, t);
    b.addEventListener('click', () => pick(p, b));
    box.append(b);
  });
  $('back').hidden = i === 0;
  $('qtext').focus({ preventScroll: true });
}

function pick(p, btn) {
  if (busy) return;
  busy = true;
  answers[i] = p;
  document.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'));
  setTimeout(() => {
    busy = false;
    if (i < Q.length - 1) { i++; renderQ(); } else { showResult(); }
  }, reduce ? 0 : 280);
}

function back() {
  if (i > 0) { i--; renderQ(); }
}

function winner(ans) {
  const c = { inn: 0, opo: 0, cor: 0, intra: 0 };
  ans.forEach((p) => { c[p]++; });
  const max = Math.max(...ORDER.map((p) => c[p]));
  const tied = ORDER.filter((p) => c[p] === max);
  let win = tied[0];
  if (tied.length > 1) {
    for (let k = ans.length - 1; k >= 0; k--) {
      if (tied.includes(ans[k])) { win = ans[k]; break; }
    }
  }
  return { win, c };
}

function showResult() {
  const { win, c } = winner(answers);
  const r = P[win];
  $('rIcon').innerHTML = ICONS[win];
  $('rName').textContent = r.name;
  $('rDesc').textContent = r.desc;
  $('rTheory').textContent = r.theory;
  $('rSec').textContent = 'Búscalo en la infografía: ' + r.sec;
  const ul = $('rBars');
  ul.replaceChildren();
  const sorted = ORDER.slice().sort((a, b) => (c[b] - c[a]) || (a === win ? -1 : b === win ? 1 : 0));
  sorted.forEach((p) => {
    const li = document.createElement('li');
    if (p === win) li.className = 'win';
    const name = document.createElement('span');
    name.textContent = P[p].short;
    const track = document.createElement('span');
    track.className = 'track';
    const fill = document.createElement('span');
    fill.className = 'fill';
    fill.style.width = '0%';
    track.append(fill);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = c[p] + '/' + Q.length;
    li.append(name, track, num);
    ul.append(li);
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = (c[p] / Q.length * 100) + '%'; }));
  });
  show('result');
  $('rName').focus({ preventScroll: true });
}

renderProfiles();
$('start').addEventListener('click', start);
$('back').addEventListener('click', back);
$('again').addEventListener('click', () => show('intro'));
</script>
</body>
</html>
